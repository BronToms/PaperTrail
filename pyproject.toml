[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "papertrail-ml"
version = "0.1.0"
description = "Evidence-first retrieval experiments over ML research papers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "scikit-learn>=1.6,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
semantic = ["sentence-transformers>=5,<6"]

[project.scripts]
papertrail = "papertrail.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/papertrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
